# MailFlow — pre-built image install
#
# Quick start:
#   curl -o docker-compose.yml https://raw.githubusercontent.com/maathimself/mailflow/main/docker-compose.ghcr.yml
#   curl -o .env               https://raw.githubusercontent.com/maathimself/mailflow/main/.env.example
#   # edit .env, then:
#   docker compose up -d
#
# To update:
#   docker compose pull && docker compose up -d --remove-orphans
#
# To pin a specific version instead of latest, set MAILFLOW_VERSION in your .env:
#   MAILFLOW_VERSION=1.0.0

services:

  # ── Frontend (Caddy: serves the React app, proxies the API, terminates HTTPS) ──
  # TLS_MODE picks how MailFlow is put online: HTTPS on APP_PORT with a self-signed
  # certificate (or yours in ./certs) and HTTP on APP_HTTP_PORT for a reverse proxy in
  # front; Let's Encrypt for DOMAIN; or HTTP only.
  frontend:
    image: ghcr.io/maathimself/mailflow-frontend:${MAILFLOW_VERSION:-latest}
    container_name: mailflow-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-443}:443"
      - "${APP_PORT:-443}:443/udp"
      - "${APP_HTTP_PORT:-80}:80"
    environment:
      # self-signed (default), letsencrypt (needs DOMAIN) or off (HTTP on port 80 only,
      # behind your own TLS-terminating proxy). See .env.example.
      TLS_MODE: ${TLS_MODE:-}
      NGINX_TLS: ${NGINX_TLS:-}
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./certs:/etc/mailflow/certs
      # Let's Encrypt certificates and account (TLS_MODE=letsencrypt).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:2080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mailflow

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/maathimself/mailflow-backend:${MAILFLOW_VERSION:-latest}
    container_name: mailflow-backend
    restart: unless-stopped
    # Room for a send in flight to finish on a restart (the backend waits up to 25 s).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-}
      FRONTEND_URL: ${APP_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-mailflow}
      DB_USER: ${DB_USER:-mailflow}
      DB_PASSWORD: ${DB_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      IMAP_MAX_PERSISTENT_PER_HOST: ${IMAP_MAX_PERSISTENT_PER_HOST:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      # false stops offering MailFlow's built-in Microsoft app for personal accounts (#674).
      MS_BUILTIN_APP: ${MS_BUILTIN_APP:-}
      # Your own OAuth apps (#676). Values saved under Settings > Email providers take
      # precedence, field by field; an empty value here counts as not set.
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_REDIRECT_URI: ${MS_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mailflow

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mailflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mailflow}
      POSTGRES_USER: ${DB_USER:-mailflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mailflow

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  mailflow:
    driver: bridge

