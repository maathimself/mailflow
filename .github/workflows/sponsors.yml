name: Update Sponsors & Star Chart

on:
  schedule:
    - cron: '0 3 * * 0'   # weekly, Sunday 03:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SPONSORS_TOKEN }}

      - name: Fetch sponsors and update README
        env:
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: node .github/scripts/update-sponsors.mjs

      # The star chart is decorative — never let a transient API blip here fail the
      # job and block the sponsors commit below. The script also retries internally.
      - name: Generate star history chart
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-star-chart.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md sponsors.json .github/assets/star-history.svg
          git diff --quiet --cached || (
            git commit -m "chore: update sponsors and star chart" &&
            git push
          )
