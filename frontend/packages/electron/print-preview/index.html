<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'none'">
  <title>MailFlow</title>
  <link rel="stylesheet" href="preview.css">
  <script type="module" src="preview.js"></script>
</head>
<body hidden>
  <header><svg class="print-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 9V3h12v6M6 17H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2"/><path d="M6 14h12v7H6zM17 12h1"/></svg><h1 data-i18n="title"></h1><button id="close" class="icon-button" data-i18n-aria="close">×</button></header>
  <main>
    <aside data-i18n-aria="settings">
      <form id="settings">
        <label class="setting"><span data-i18n="printer"></span><select id="printer" data-i18n-aria="printer"><option value="" data-i18n="loadingPrinters"></option></select></label>
        <fieldset><legend data-i18n="pages"></legend><div class="choices">
          <label><input type="radio" name="pagesMode" value="all" checked> <span data-i18n="all"></span></label>
          <label><input type="radio" name="pagesMode" value="custom"> <span data-i18n="customRange"></span></label>
          <input id="pages" data-i18n-aria="pageRange" data-i18n-placeholder="pagesPlaceholder" disabled>
        </div></fieldset>
        <label class="setting"><span data-i18n="margins"></span><select id="margins"><option value="default" data-i18n="default"></option><option value="minimum" data-i18n="minimum"></option><option value="none" data-i18n="none"></option><option value="custom" data-i18n="custom"></option></select></label>
        <label id="custom-margin-row" class="setting" hidden><span data-i18n="inches"></span><input id="custom-margin" type="number" min="0" max="2" step="0.05" value="0.4"></label>
        <label class="setting"><span data-i18n="orientation"></span><select id="orientation"><option value="portrait" data-i18n="portrait"></option><option value="landscape" data-i18n="landscape"></option></select></label>
        <label class="setting"><span data-i18n="paper"></span><select id="paper"><option>Letter</option><option>A4</option><option>Legal</option><option>A5</option><option>Tabloid</option></select></label>
        <label class="setting"><span data-i18n="copies"></span><input id="copies" type="number" min="1" max="999" value="1"></label>
        <div class="toggles">
          <label><input id="headers" type="checkbox"> <span data-i18n="headerFooter"></span></label>
          <label id="selection-label" data-i18n-title="selectFirst"><input id="selection-only" type="checkbox" disabled> <span data-i18n="selectionOnly"></span></label>
          <label><input id="background" type="checkbox"> <span data-i18n="background"></span></label>
        </div>
        <p id="error" role="alert" hidden></p>
        <div class="actions"><button id="cancel" type="button" data-i18n="cancel"></button><button id="print" class="primary" type="submit" disabled data-i18n="print"></button></div>
      </form>
      <button id="save" type="button" disabled data-i18n="savePdf"></button>
    </aside>
    <section class="preview" data-i18n-aria="documentPreview">
      <nav data-i18n-aria="navigation">
        <button id="previous" class="icon-button" data-i18n-aria="previous" disabled>‹</button>
        <label><span data-i18n="page"></span> <input id="page" type="number" min="1" value="1" data-i18n-aria="page" disabled></label><span id="page-count"></span>
        <button id="next" class="icon-button" data-i18n-aria="next" disabled>›</button>
        <span class="divider"></span>
        <label class="zoom-label"><span data-i18n="zoom"></span> <select id="zoom" data-i18n-aria="zoom"><option value="fit" data-i18n="fitWidth"></option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label>
      </nav>
      <div id="viewport"><div id="status" role="status" data-i18n="preparing"></div><canvas id="paper-preview" data-i18n-aria="printedPage" hidden></canvas></div>
    </section>
  </main>
</body>
</html>
